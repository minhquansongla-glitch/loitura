<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lôi Từ Ra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Bố cục: một cột 720px. Thẻ học lớn ở giữa, bốn tab điều hướng ở đầu trang, dải 3 giây màu hổ phách là điểm nhấn duy nhất. */
:root{
  --bg:#EDF0F5;--surface:#FFFFFF;--ink:#0F1A2B;--muted:#5A6779;--line:#D8DEE8;
  --accent:#2448E8;--accent-ink:#FFFFFF;--accent-soft:#E4E9FD;--timer:#F2A413;
  --good:#0E8F63;--good-soft:#DDF3EA;--warn:#B45309;--warn-soft:#FBEBD0;--bad:#C8323B;--bad-soft:#FADDDF;
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1118;--surface:#151C26;--ink:#E8ECF4;--muted:#95A1B5;--line:#283242;
  --accent:#7F97FF;--accent-ink:#0C1118;--accent-soft:#1E2846;--timer:#F5B942;
  --good:#3DD39A;--good-soft:#123227;--warn:#F0B35A;--warn-soft:#382A11;--bad:#FF7B83;--bad-soft:#3A1A1D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1118;--surface:#151C26;--ink:#E8ECF4;--muted:#95A1B5;--line:#283242;
  --accent:#7F97FF;--accent-ink:#0C1118;--accent-soft:#1E2846;--timer:#F5B942;
  --good:#3DD39A;--good-soft:#123227;--warn:#F0B35A;--warn-soft:#382A11;--bad:#FF7B83;--bad-soft:#3A1A1D;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
header p{max-width:52ch}

nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
nav button{font:inherit;font-weight:500;font-size:14px;padding:9px 4px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;min-width:0}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.row-tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
.seg i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.btn{font:inherit;font-weight:600;font-size:15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{padding:8px;min-height:36px;min-width:36px;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}
.grow{flex:1 1 140px}

.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0;flex:1 1 150px}
select,input[type=text],textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
textarea{min-height:90px;resize:vertical}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}

.flash{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-height:320px;min-width:0}
.flash .label{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.prompt{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.prompt.ipa{font-family:var(--f-body);font-weight:500;font-size:clamp(24px,6vw,32px)}
.hint{font-size:14px;color:var(--muted)}
.sent{font-size:18px;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;border-bottom:3px solid var(--timer);height:1em;vertical-align:-2px;margin-inline:2px}
mark{background:var(--accent-soft);color:var(--accent);padding:0 4px;border-radius:5px;font-weight:600}
.timer{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--timer);border-radius:99px}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,48px);letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.ipa-line{color:var(--muted);font-size:17px}
.scene{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:10px 14px;font-size:32px;line-height:1.2;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.scene small{flex-basis:100%;font-size:11px;font-weight:600;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:'Be Vietnam Pro',system-ui,sans-serif}
.wordrow{display:flex;gap:16px;align-items:center;justify-content:space-between}
.wordrow>div:first-child{min-width:0}
.pic{flex:none;font-size:64px;line-height:1;background:var(--accent-soft);border-radius:20px;padding:14px 18px;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
@media(max-width:420px){.pic{font-size:48px;padding:10px 12px}}
.typed{font-size:14px;padding:6px 10px;border-radius:8px;align-self:flex-start}
.typed.ok{background:var(--good-soft);color:var(--good)}
.typed.no{background:var(--warn-soft);color:var(--warn)}
.mic{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mic .btn.rec{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.say-out{font-size:15px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);min-height:20px;align-self:stretch}
.inp-sw{display:flex;gap:6px}
.inp-sw .btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rate{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:auto}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .track{flex:1}
.prog .track i{background:var(--accent)}

.ph{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ph:first-child{border-top:0}
.ph .seg{grid-column:1/-1;height:6px}
.ph .nm{font-weight:600}
.phh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.lgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:8px}
.lchip{position:relative;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card,transparent);color:inherit;font:600 14px inherit;font-family:inherit;cursor:pointer}
.lchip i{position:absolute;top:1px;right:4px;font-size:10px;font-style:normal;color:var(--accent)}
.lchip.dn{background:var(--accent-soft)}
.lchip.nx{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.lchip.sel{background:var(--accent);color:#fff}
.lchip.sel i{color:#fff}
.lprev{grid-column:1/-1;margin-top:10px;padding:12px;border-radius:14px;background:var(--accent-soft)}
.ph .sb{font-size:13px;color:var(--muted)}
.ph.now .nm::after{content:" · đang học";color:var(--accent);font-weight:600;font-size:13px}
.vlist{display:flex;flex-wrap:wrap;gap:6px}
.vlist span{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;display:grid;place-items:center;margin-top:1px}
.steps b{font-weight:600}

.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.scard{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.scard:hover{border-color:var(--accent)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tabs2 button{font:inherit;font-size:14px;font-weight:500;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs2 button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.passage{font-size:17px;line-height:2.1;overflow-wrap:anywhere}
input.gap{display:inline-block;width:auto;min-width:5ch;padding:1px 6px;border:0;border-bottom:2px solid var(--timer);border-radius:4px 4px 0 0;background:var(--bg);font-size:16px;text-align:center}
input.gap.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
input.gap.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.fix{color:var(--good);font-weight:600;font-size:14px;margin-inline:2px}
.olist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.orow .row-tap{flex:1;min-width:0;text-align:left;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:4px 0;overflow-wrap:anywhere}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.num.set{border:0;background:var(--accent);color:var(--accent-ink)}
.num.ok{background:var(--good);color:var(--accent-ink)}
.num.bad{background:var(--bad);color:var(--accent-ink)}
.veil{filter:blur(6px);user-select:none;cursor:pointer}
.lis{background:linear-gradient(135deg,var(--accent-soft),transparent 70%);border:1px solid var(--line,rgba(128,128,128,.25));border-radius:20px}
.lis .ps{display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.65}
.lis .ps p{margin:0;display:flex;gap:8px;align-items:flex-start}
.lis .ps .sb{flex:none;width:30px;height:30px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.lis .ps .sb svg{width:15px;height:15px}
.lis .sp{font-style:normal;font-weight:700;color:var(--accent)}
.lis .ps b{background:var(--accent-soft);border-radius:5px;padding:0 3px}
.lis .vi{display:block;font-size:14px;color:var(--muted,inherit);opacity:.85}
.lis .ps p.on{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px}
.bar .track i.a{background:var(--accent)}
.bar .track i.b{background:var(--timer)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.callout{background:var(--warn-soft);border-radius:12px;padding:12px 14px;color:var(--ink)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .en{font-weight:600;font-size:16px}
.item .sub{grid-column:1/2;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .act{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.meter i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.meter i.on{background:var(--good)}
details summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;z-index:9}
@media (max-width:420px){.bar{grid-template-columns:84px 1fr 40px}h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Lớp trang trí: gradient, bóng đổ, chuyển động ===== */
:root{--g1:#2448E8;--g2:#7C3AED;--blob1:rgba(36,72,232,.14);--blob2:rgba(124,58,237,.12);--glow:rgba(36,72,232,.30);--shadow:0 1px 2px rgba(15,26,43,.05),0 10px 28px rgba(15,26,43,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#4F6BFF;--g2:#9B6CFF;--blob1:rgba(79,107,255,.18);--blob2:rgba(155,108,255,.14);--glow:rgba(127,151,255,.28);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--g1:#4F6BFF;--g2:#9B6CFF;--blob1:rgba(79,107,255,.18);--blob2:rgba(155,108,255,.14);--glow:rgba(127,151,255,.28);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
body{background:radial-gradient(600px 320px at 8% -4%,var(--blob1),transparent 70%),radial-gradient(520px 300px at 100% 2%,var(--blob2),transparent 70%),var(--bg);background-attachment:fixed}
header{flex-direction:row;align-items:center;gap:14px;margin-bottom:18px}
.logo{flex:none;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;box-shadow:0 8px 20px var(--glow)}
.logo svg{width:32px;height:32px}
.hd{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header p{font-size:14px}
nav{grid-template-columns:repeat(5,1fr);box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.15;padding:8px 2px;transition:background .2s,color .2s,transform .15s}
nav button .ic{font-size:20px;line-height:1;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
nav button:hover{background:var(--accent-soft);color:var(--accent)}
nav button[aria-selected="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 12px var(--glow)}
@media(min-width:560px){nav button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:10px 4px}}
.panel,.stat,.flash,.scard{box-shadow:var(--shadow)}
.stack>.field{flex:none}
.flash{border-radius:24px;border-top:4px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,var(--g1),var(--g2)) border-box}
.stat{position:relative;overflow:hidden}
.stat .si{position:absolute;right:10px;top:8px;font-size:22px;opacity:.9;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.btn{transition:transform .12s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,26,43,.10)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff;box-shadow:0 6px 18px var(--glow)}
.btn.primary:hover:not(:disabled){box-shadow:0 10px 26px var(--glow)}
.track i{background:linear-gradient(90deg,#F2A413,#FF7A45)}
.prog .track i{background:linear-gradient(90deg,var(--g1),var(--g2))}
.timer .track{height:10px}
.chip{background:linear-gradient(135deg,var(--accent-soft),transparent),var(--accent-soft)}
.scard{transition:transform .15s,border-color .2s,box-shadow .2s}
.scard:hover{transform:translateY(-2px);box-shadow:0 12px 28px var(--glow)}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));border:0;color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 34px var(--glow)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;left:-30px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero .tag,.hero .muted,.hero .hint{color:rgba(255,255,255,.88)}
.hero h2{color:#fff}
.hero .vlist span{background:rgba(255,255,255,.18);color:#fff;}
.hero .btn.primary{background:#fff;color:#2338B8;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.hero-row{display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero-row>.stack{min-width:0;flex:1}
.ring{flex:none;position:relative;width:88px;height:88px}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.25)}
.ring .fg{stroke:#fff;transition:stroke-dashoffset .8s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:19px;font-weight:800}
.ph .seg i{background:linear-gradient(90deg,var(--g1),var(--g2))!important}
.pic{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.scene{animation:rise .4s .1s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
#view>.stack>*{animation:rise .25s both}
@media (max-width:600px){#view>.stack>*{animation:none}.hero:before,.hero:after{display:none}}
#view>.stack>*:nth-child(2){animation-delay:.06s}
#view>.stack>*:nth-child(3){animation-delay:.12s}
#view>.stack>*:nth-child(4){animation-delay:.18s}
#view>.stack>*:nth-child(5){animation-delay:.24s}
.flame{display:inline-block;animation:flick 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}

function sceneEmoji(w){
  const toks=(w.ctx||'').toLowerCase().replace(/[^a-z0-9' -]+/g,' ').split(/\s+/).filter(Boolean),out=[];
  const forms=t=>{const f=[t];if(t.endsWith('ies'))f.push(t.slice(0,-3)+'y');if(t.endsWith('es'))f.push(t.slice(0,-2));if(t.endsWith('s'))f.push(t.slice(0,-1));if(t.endsWith('ed')){f.push(t.slice(0,-2));f.push(t.slice(0,-1))}if(t.endsWith('ing')){f.push(t.slice(0,-3));f.push(t.slice(0,-3)+'e')}return f};
  const look=t=>{for(const f of forms(t))if(EMJ[f])return EMJ[f];return ''};
  for(let i=0;i<toks.length&&out.length<5;i++){
    let e='';
    for(let n=3;n>=2&&!e;n--){const ph=toks.slice(i,i+n).join(' ');if(i+n<=toks.length&&EMJ[ph]){e=EMJ[ph];i+=n-1}}
    if(!e)e=look(toks[i])||PRON[toks[i]]||'';
    if(e&&!out.includes(e))out.push(e)}
  return out}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=()=>[...RAW,...S.custom];

const byId=id=>RM.get(id)||S.custom.find(w=>w.id===id);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const wre=t=>new RegExp('(^|[^A-Za-z])('+reEsc(t)+'[A-Za-z]*)','i');
function findIn(text,t){const m=text.match(wre(t));if(!m)return null;const i=m.index+m[1].length;return{i,form:m[2]}}
const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function markDay(){const k=dayKey();if(!S.days.includes(k)){S.days.push(k);S.days=S.days.slice(-90)}save()}
function streak(){let n=0;const d=new Date();if(!S.days.includes(dayKey(d)))d.setDate(d.getDate()-1);while(S.days.includes(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}

let gOver=null;const hasTTS='speechSynthesis' in window;
if(hasTTS)speechSynthesis.onvoiceschanged=()=>{const s=$('#set-voice');if(s)s.innerHTML=voiceOpts()};
const LANGS=['en-US','en-GB','en-IN','en-AU'];
const pickLang=()=>S.set.accent==='mix'?LANGS[Math.floor(Math.random()*LANGS.length)]:S.set.accent;
function vscore(v){const n=v.name;let s=0;
  if(/natural|neural|online/i.test(n))s+=100;
  if(/premium|enhanced/i.test(n))s+=80;
  if(/google/i.test(n))s+=50;
  if(/aria|jenny|guy|ava|andrew|emma|brian|samantha|allison|zoe|evan|nathan|serena|daniel|libby|sonia|ryan|joanna|matthew/i.test(n))s+=20;
  if(/compact|espeak|zira|david|\bmark\b|hazel|george/i.test(n))s-=60;
  const FEM=/aria|jenny|ava\b|emma|samantha|allison|zoe|serena|libby|sonia|joanna|michelle|jessica|nancy|sara|susan|kendra|kimberly|salli|ivy|amy|olivia|female|karen|moira|tessa|fiona|victoria|google us english/i,MAL=/guy|andrew|brian|evan|nathan|daniel|ryan|matthew|david|mark|george|eric|roger|christopher|steffan|joey|justin|kevin|male|alex|tom|fred|aaron/i;
  const g=gOver||S.set.gender||'f';
  if(g==='f'){if(FEM.test(n)&&!/\bmale\b/i.test(n))s+=200;else if(MAL.test(n))s-=200}
  else{if(MAL.test(n))s+=200;else if(FEM.test(n))s-=200}
  if(!v.localService)s+=10;return s}
const vnorm=v=>v.lang.replace('_','-').toLowerCase();
function enVoices(){return hasTTS?speechSynthesis.getVoices().filter(v=>vnorm(v).startsWith('en')).sort((a,b)=>vscore(b)-vscore(a)):[]}
function pickVoice(lang){if(!hasTTS)return null;
  const all=enVoices();if(S.set.voice&&!gOver){const m=all.find(v=>v.voiceURI===S.set.voice);if(m)return m}
  const exact=all.filter(v=>vnorm(v)===lang.toLowerCase());return (exact.length?exact:all)[0]||null}
function voiceOpts(){return '<option value="">Tự chọn giọng tự nhiên nhất</option>'+enVoices().map(v=>`<option value="${esc(v.voiceURI)}"${S.set.voice===v.voiceURI?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
let AIDX=null,APK={},curAud=null;
try{fetch('audio/index.json').then(r=>r.ok?r.json():null).then(j=>{AIDX=j;if(j){const f=()=>{const p=0;if(!APK[p])APK[p]=fetch('audio/pack_'+p+'.mp3').then(r=>r.ok?r.arrayBuffer():null).catch(()=>null)};(window.requestIdleCallback||setTimeout)(f,1500)}}).catch(()=>{})}catch(e){}
async function clip(text){
  if(!AIDX||!AIDX[text])return null;
  const [p,o,l]=AIDX[text];
  if(!APK[p])APK[p]=fetch('audio/pack_'+p+'.mp3').then(r=>r.ok?r.arrayBuffer():null).catch(()=>null);
  const buf=await APK[p];if(!buf)return null;
  return URL.createObjectURL(new Blob([buf.slice(o,o+l)],{type:'audio/mpeg'}))}
function say(text,rate,lang){
  return (gOver==='m'?Promise.resolve(null):clip(text)).then(url=>{
    if(url)return new Promise(res=>{
      if(hasTTS)speechSynthesis.cancel();
      if(curAud){try{curAud.pause()}catch(e){}}
      const a=new Audio(url);curAud=a;a.playbackRate=rate&&rate<.8?.8:1;try{a.preservesPitch=true}catch(e){}
      a.onended=()=>{URL.revokeObjectURL(url);res()};a.onerror=()=>{res()};
      a.play().catch(()=>{res()})});
    return sayTTS(text,rate,lang)})}
function sayTTS(text,rate,lang){
  if(!hasTTS){toast('Thiết bị này chưa hỗ trợ giọng đọc.');return Promise.resolve()}
  speechSynthesis.cancel();lang=lang||pickLang();
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=pickVoice(lang);if(v){u.voice=v;u.lang=v.lang}
  u.rate=rate||S.set.rate;if(gOver==='m'&&v&&!/\b(guy|andrew|brian|evan|nathan|daniel|ryan|matthew|david|mark|george|eric|roger|christopher|steffan|joey|justin|kevin|male|alex|tom|fred|aaron)\b/i.test(v.name))u.pitch=.7;
  return new Promise(res=>{u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
let playTok=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stopAudio(){playTok++;gOver=null;if(curAud){try{curAud.pause()}catch(e){}}if(hasTTS)speechSynthesis.cancel()}
async function playSeq(list,rate){const tok=++playTok;const lang=pickLang();for(const t of list){if(tok!==playTok)return;await say(t,rate,lang);if(tok!==playTok)return;await wait(450)}}

function counts(){

  const q=due.concat(ids);
  session={queue:q,idx:0,phase:'front',ok:0,near:0,fail:0,req:{},typed:'',alts:[],lesson:n,fresh:new Set(ids)};

function planFix(){if(!S.plan)S.plan={done:0,last:''};if(S.plan.base===undefined){S.plan.base=S.plan.done||0;S.plan.ok={}}if(!S.plan.ok)S.plan.ok={}}
const lDone=n=>n<=(S.plan.base||0)||!!S.plan.ok[n];
let openPh=null,pickL=null;const nextL=()=>{planFix();for(let n=1;n<=LESSONS;n++)if(!lDone(n))return n;return LESSONS};

    const a=Math.floor(idx[0]/PER)+1,b=Math.floor(idx[idx.length-1]/PER)+1;

    ${doneToday&&!finished?'<p class="hint">Bạn đã hoàn thành bài hôm nay. Học thêm là tùy bạn, mỗi bài mới vẫn tính là một ngày trong lộ trình.</p>':''}

function modeFor(w){
  let m=S.set.mode;
  if(m==='auto'){const b=P(w.id).box;m=b<=1?'meaning':b<=3?'cloze':'ipa'}
  if(m==='cloze'&&!findIn(w.ctx,w.en))m='meaning';
  return m}
function startSession(){
  const pool=words().filter(w=>S.set.topic==='all'||w.topic===S.set.topic),now=Date.now();
  const due=pool.filter(w=>P(w.id).seen&&P(w.id).due<=now).sort((a,b)=>P(a.id).due-P(b.id).due);
  const PR={meeting:0,business:0,office:1,daily:1,general:2,custom:0};
  const fresh=shuffle(pool.filter(w=>!P(w.id).seen)).sort((a,b)=>(PR[a.topic]??2)-(PR[b.topic]??2));
  const n=S.set.batch;let q=due.slice(0,n);q=q.concat(fresh.slice(0,n-q.length));
  if(!q.length){toast('Chủ đề này đã ôn xong hôm nay. Thử chủ đề khác hoặc quay lại ngày mai.');return}

the minutes and attach the slides to the email.","Sau đó tôi sẽ viết biên bản họp và đính kèm các slide vào email."],["","Our main concern was the slow progress on the website.","Mối lo ngại chính của chúng tôi là tiến độ làm website chậm."],["","Some of us wanted to postpone the launch by a week.","Một số người muốn hoãn việc ra mắt một tuần."],["","I suggest we wait until Monday before we make a decision.","Tôi đề nghị chờ đến thứ Hai rồi hãy đưa ra quyết định."],["","Our manager didn't agree at first.","Lúc đầu quản lý của chúng tôi không đồng ý."],["","But after we showed her the numbers, she changed her mind.","Nhưng sau khi chúng tôi cho cô ấy xem số liệu, cô ấy đã đổi ý."],["","Now we all agree that a short delay is safer.","Giờ tất cả chúng tôi đều đồng ý rằng trì hoãn ngắn sẽ an toàn hơn."],["","I'll send the minutes this afternoon.","Chiều nay tôi sẽ gửi biên bản họp."],["","Then we can all move on to the next task.","Sau đó tất cả chúng ta có thể chuyển sang việc tiếp theo."]]],"3":["Going Over the Slides","Xem lại các slide","dialogue",[["Priya","Morning, Tom. Shall we go over the slides before the call?","Chào Tom. Mình xem lại các slide trước cuộc gọi nhé?"],["Tom","Sure. Let me share my screen. Can you see it?","Được. Để tôi chia sẻ màn hình. Chị thấy chưa?"],["Priya","Yes. Let's start with the introduction.","Thấy rồi. Ta bắt đầu với phần giới thiệu."],["Tom","Okay. It's short, just a quick overview of the project.","Được. Nó ngắn thôi, chỉ là tổng quan nhanh về dự án."],["Priya","Good. Please highlight the main numbers in yellow.","Tốt. Anh làm nổi bật các con số chính bằng màu vàng nhé."],["Tom","Done. Now take a look at the second item on the list.","Xong rồi. Giờ chị xem qua hạng mục thứ hai trong danh sách."],["Priya","That's the budget. What's the key point there?","Đó là ngân sách. Điểm chính ở đó là gì?"],["Tom","We're spending less than planned, which is great news.","Ta đang chi ít hơn kế hoạch, đó là tin rất tốt."],["Priya","Nice. Go ahead and add that to the summary.","Hay đấy. Anh cứ thêm điều đó vào phần tóm tắt đi."],["Tom","Will do. I'll also write one action item for each person.","Được. Tôi cũng sẽ viết một đầu việc cho mỗi người."],["Priya","Perfect. What's the next step after the call?","Hoàn hảo. Bước tiếp theo sau cuộc gọi là gì?"],["Tom","We send the final version to the client.","Ta gửi bản cuối cho khách hàng."]]],"4":["Wrapping Up a Team Meeting","Kết thúc buổi họp nhóm","talk",[["","Thanks for coming, everyone. I'll keep this short because we're running out of time.","Cảm ơn mọi người đã đến. Tôi sẽ nói ngắn gọn vì chúng ta sắp hết thời gian."],["","Today I want to bring up a problem with our app.","Hôm nay tôi muốn nêu ra một vấn đề với ứng dụng của chúng ta."],["","Someone on the support team pointed out that it crashes on older phones.","Một người bên hỗ trợ đã chỉ ra rằng nó bị treo trên điện thoại đời cũ."],["","I'll look into it this afternoon.","Chiều nay tôi sẽ xem xét việc này."],["","I'll get back to you by tomorrow with an answer.","Ngày mai tôi sẽ liên hệ lại với mọi người kèm câu trả lời."],["","Next, I'd like to set up a weekly call for the team.","Tiếp theo, tôi muốn sắp xếp một cuộc gọi hằng tuần cho nhóm."],["","It's a good way to catch up on what everyone's doing.","Đó là cách hay để cập nhật xem mọi người đang làm gì."],["","If nobody has questions, let's carry on with the next topic.","Nếu không ai có câu hỏi, ta tiếp tục sang chủ đề kế tiếp."],["","Before we wrap up, let me sum up the main points.","Trước khi kết thúc, để tôi tóm tắt các điểm chính."],["","First, we found a bug. Second, we'll fix it soon.","Một, chúng ta tìm ra một lỗi. Hai, chúng ta sẽ sớm sửa nó."],["","Third, we'll meet every week.","Ba, chúng ta sẽ họp mỗi tuần."],["","Thanks, and have a good day.","Cảm ơn mọi người, chúc một ngày tốt lành."]]],"5":["A Late Delivery","Một vụ giao hàng trễ","dialogue",[["David","Anita, the client just complained about the late delivery.","Anita, khách hàng vừa phàn nàn về việc giao hàng trễ."],["Anita","Oh no. Who's in charge of that account?","Ôi không. Ai phụ trách tài khoản đó vậy?"],["David","I am. I need to find out what went wrong.","Tôi. Tôi cần tìm hiểu xem đã có chuyện gì."],["Anita","Let's figure out the cause first. Was it the warehouse?","Ta tìm ra nguyên nhân trước đã. Có phải do kho hàng không?"],["David","Maybe. I'll call them as soon as possible.","Có thể. Tôi sẽ gọi họ càng sớm càng tốt."],["Anita","Good. I can deal with the client's emails if you like.","Tốt. Tôi có thể xử lý email của khách nếu anh muốn."],["David","Thanks, that would help. We need to come up with a fair offer.","Cảm ơn, vậy thì tốt quá. Ta cần nghĩ ra một đề nghị hợp lý."],["Anita","How about a discount? I think we can work out something reasonable.","Giảm giá thì sao? Tôi nghĩ ta giải quyết được một mức hợp lý."],["David","Okay. I'll take care of the paperwork.","Được. Tôi sẽ lo phần giấy tờ."],["Anita","Please make sure the manager approves it first.","Nhớ đảm bảo quản lý duyệt trước nhé."],["David","Of course. Let's keep in touch during the day.","Tất nhiên. Hôm nay ta giữ liên lạc nhé."],["Anita","Sounds good.","Nghe ổn đấy."]]],"6":["Welcome Speech for Visitors","Lời chào đón khách tham quan","talk",[["","Good morning. On behalf of the whole team, welcome to our office.","Chào buổi sáng. Thay mặt cả nhóm, chào mừng quý vị đến văn phòng chúng tôi."],["","Thank you in advance for your patience today.","Xin cảm ơn trước vì sự kiên nhẫn của quý vị hôm nay."],["","We have a full day, so we'll start right away.","Chúng ta có một ngày đầy lịch, nên sẽ bắt đầu ngay."],["","To be honest, I was nervous about this presentation.","Thành thật mà nói, tôi đã hơi lo về bài thuyết trình này."],["","In my opinion, our new tool is very easy to use.","Theo ý tôi, công cụ mới của chúng tôi rất dễ dùng."],["","For example, you can create a report in two clicks.","Ví dụ, quý vị có thể tạo báo cáo chỉ với hai cú nhấp."],["","In other words, it saves a lot of time.","Nói cách khác, nó tiết kiệm rất nhiều thời gian."],["","As far as I know, no other tool does that.","Theo như tôi biết, không công cụ nào khác làm được vậy."],["","I'd like to make a point about training as well.","Tôi cũng muốn nêu một quan điểm về việc đào tạo."],["","We offer free classes to every customer.","Chúng tôi cung cấp lớp học miễn phí cho mọi khách hàng."],["","By the way, the coffee outside is free.","Nhân tiện, cà phê bên ngoài là miễn phí."],["","Please help yourselves.","Mời quý vị cứ tự nhiên dùng."]]],"7":["Why Did Sales Drop?","Vì sao doanh số giảm?","dialogue",[["Emma","Raj, can you have a look at these sales numbers?","Raj, anh xem qua các số liệu bán hàng này được không?"],["Raj","Sure. First of all, what's the main problem?","Được. Trước hết, vấn đề chính là gì?"],["Emma","According to the report, sales dropped by ten percent.","Theo báo cáo, doanh số giảm mười phần trăm."],["Raj","That's bad. Is it due to the weather?","Tệ thật. Có phải do thời tiết không?"],["Emma","Partly. We also lost a big customer. As a result, we're behind target.","Một phần. Ta còn mất một khách lớn. Kết quả là ta chưa đạt mục tiêu."],["Raj","We should take into account the new prices.","Ta nên tính đến cả mức giá mới."],["Emma","True. In terms of cost, we're doing fine.","Đúng. Xét về chi phí thì ta vẫn ổn."],["Raj","On the other hand, our ads aren't working well.","Mặt khác, quảng cáo của ta chạy không tốt."],["Emma","Well, we should at least try a new campaign.","Vậy thì ít nhất ta nên thử một chiến dịch mới."],["Raj","Agreed. It can't hurt, after all.","Đồng ý. Rốt cuộc thì thử cũng chẳng hại gì."],["Emma","Great. I'll write a plan tomorrow.","Tuyệt. Ngày mai tôi sẽ viết một kế hoạch."],["Raj","Thanks. Send it to me when it's ready.","Cảm ơn. Xong thì gửi cho tôi nhé."],["Emma","I will. I want the whole team to see it too.","Được. Tôi cũng muốn cả nhóm xem nó."],["Raj","Good idea. More opinions will help us decide.","Ý hay. Càng nhiều ý kiến càng giúp ta quyết định."]]],"8":["A Busy Day in Support","Một ngày bận rộn ở bộ phận hỗ trợ","talk",[["","I work in customer support, and today was really busy.","Tôi làm ở bộ phận hỗ trợ khách hàng, và hôm nay thực sự rất bận."],["","At the moment, I'm waiting for a new laptop.","Hiện tại tôi đang chờ một chiếc laptop mới."],["","For now, I'm using an old one. It's slow, but no problem.","Tạm thời tôi dùng cái cũ. Nó chậm nhưng không vấn đề gì."],["","This morning a customer called and said, \"Excuse me, is this the billing team?\"","Sáng nay một khách hàng gọi và hỏi: \"Xin lỗi, đây có phải bộ phận thanh toán không?\""],["","I said, \"Of course! How can I help you?\"","Tôi nói: \"Tất nhiên ạ! Tôi có thể giúp gì cho chị?\""],["","The line was bad, so I said, \"Pardon? Could you say that again?\"","Đường truyền kém, nên tôi nói: \"Xin chị nhắc lại được không ạ?\""],["","She wanted a refund right away.","Chị ấy muốn được hoàn tiền ngay lập tức."],["","I said, \"That makes sense. Let me check your account.\"","Tôi nói: \"Như vậy là hợp lý. Để tôi kiểm tra tài khoản của chị.\""],["","She said she could send the receipt. I said, \"Good point, that will help.\"","Chị ấy nói có thể gửi biên lai. Tôi đáp: \"Ý hay ạ, vậy sẽ giúp ích.\""],["","Finally, I offered a refund by Friday.","Cuối cùng, tôi đề nghị hoàn tiền trước thứ Sáu."],["","She said, \"Sounds good.\"","Chị ấy nói: \"Nghe ổn đấy.\""],["","I was happy it went well.","Tôi rất vui vì mọi việc suôn sẻ."]]],"9":["Meeting a New Partner","Gặp đối tác mới","dialogue",[["Linda","Hi, I'm Linda. Pleased to meet you.","Chào, tôi là Linda. Rất vui được gặp anh."],["Mark","Pleased to meet you too. I look forward to working with you.","Tôi cũng rất vui được gặp chị. Tôi mong được làm việc cùng chị."],["Linda","Me too. First, I must apologize for the email yesterday.","Tôi cũng vậy. Trước hết, tôi phải xin lỗi về email hôm qua."],["Mark","Oh, which email?","Ồ, email nào vậy?"],["Linda","I regret sending the wrong file. It was a misunderstanding.","Tôi tiếc vì đã gửi nhầm tệp. Đó là một sự hiểu lầm."],["Mark","I see. Could you elaborate a little?","Tôi hiểu rồi. Chị nói rõ hơn một chút được không?"],["Linda","Sure. I thought you wanted the old version, not the new one.","Được. Tôi tưởng anh cần bản cũ, không phải bản mới."],["Mark","Ah, no problem. Thanks a lot for explaining.","À, không sao. Cảm ơn chị nhiều vì đã giải thích."],["Linda","You're welcome. Is there anything else?","Không có chi. Còn gì nữa không?"],["Mark","Could you resend the correct file today?","Hôm nay chị gửi lại đúng tệp được không?"],["Linda","My pleasure. I'll do it right now.","Rất hân hạnh. Tôi sẽ làm ngay bây giờ."],["Mark","Great. Let's have lunch together soon.","Tuyệt. Sớm mời chị ăn trưa cùng nhé."],["Linda","I'd love that. There's a nice place near our office.","Tôi rất muốn. Có một quán ngon gần văn phòng chúng tôi."],["Mark","Perfect. I'll send you a message on Monday.","Tuyệt. Thứ Hai tôi sẽ nhắn cho chị."],["Linda","Sounds like a plan. Talk to you then.","Vậy chốt nhé. Hẹn nói chuyện với chị lúc đó."]]],"10":["A Heated Meeting","Một cuộc họp căng thẳng","talk",[["","Last week's meeting got a bit heated.","Cuộc họp tuần trước hơi căng thẳng."],["","I'd like to refer to the notes I took.","Tôi muốn tham chiếu đến các ghi chú tôi đã ghi."],["","Our director wanted to propose a new office downtown.","Giám đốc của chúng tôi muốn đề nghị một văn phòng mới ở trung tâm."],["","I didn't want to interrupt, but I disagree with the idea.","Tôi không muốn ngắt lời, nhưng tôi không đồng ý với ý tưởng đó."],["","I wanted to emphasize the cost, which is very high.","Tôi muốn nhấn mạnh chi phí, vốn rất cao."],["","Some colleagues objected too.","Một vài đồng nghiệp cũng phản đối."],["","Others argued that the location is perfect.","Những người khác thì tranh luận rằng vị trí này rất hoàn hảo."],["","I tried to convince them with numbers.","Tôi cố thuyết phục họ bằng các con số."],["","In the end, I couldn't persuade everyone.","Cuối cùng, tôi không thuyết phục được tất cả mọi người."],["","So I recommend we compare two more offices first.","Vì vậy tôi khuyên ta nên so sánh thêm hai văn phòng nữa trước."],["","I think that's a fair approach.","Tôi nghĩ đó là cách làm công bằng."],["","Everyone has a right to their opinion.","Ai cũng có quyền có ý kiến của mình."],["","But in a team, we still need to listen to each other.","Nhưng trong một nhóm, chúng ta vẫn cần lắng nghe nhau."],["","I hope next week's meeting will be calmer.","Tôi hy vọng cuộc họp tuần sau sẽ êm dịu hơn."],["","I'll bring coffee for everyone, just in case.","Tôi sẽ mang cà phê cho mọi người, phòng khi cần."]]],"11":["Choosing a Launch Date","Chọn ngày ra mắt","dialogue",[["Sarah","Mark, we need to decide on the launch date today.","Mark, hôm nay chúng ta cần quyết định ngày ra mắt."],["Mark","I know. Half the team wants June. The other half wants August.","Tôi biết. Một nửa nhóm muốn tháng Sáu, nửa còn lại muốn tháng Tám."],["Sarah","Let's take a vote.","Hãy bỏ phiếu đi."],["Mark","Good idea. If the majority picks June, we go with June.","Ý hay. Nếu đa số chọn tháng Sáu thì mình làm tháng Sáu."],["Sarah","Before that, can I share my view?","Trước đó, tôi nói quan điểm của mình được không?"],["Mark","Sure. I'd like to hear your perspective.","Được chứ. Tôi muốn nghe góc nhìn của bạn."],["Sarah","June is too early. We assume the vendor will deliver on time, but that's risky.","Tháng Sáu quá sớm. Ta cho rằng nhà cung cấp sẽ giao đúng hạn, nhưng thế là rủi ro."],["Mark","That's a fair assumption to question. Can we find a compromise?","Đó là một giả định đáng đặt câu hỏi. Ta tìm giải pháp thỏa hiệp được không?"],["Sarah","Maybe July. It gives us extra time.","Có lẽ là tháng Bảy. Như vậy có thêm thời gian."],["Mark","Let me check the forecast. I predict sales will be strong in July.","Để tôi xem dự báo. Tôi dự đoán doanh số tháng Bảy sẽ mạnh."],["Sarah","What's your estimate for the cost of a delay?","Bạn ước tính chi phí của việc trì hoãn là bao nhiêu?"],["Mark","Roughly twenty thousand dollars.","Khoảng hai mươi nghìn đô la."],["Sarah","That's acceptable. Let's put July to a vote.","Chấp nhận được. Hãy đưa tháng Bảy ra bỏ phiếu."],["Mark","Agreed. I'll send the message to everyone now.","Đồng ý. Tôi sẽ gửi tin nhắn cho mọi người ngay."]]],"12":["Speaking Clearly in Meetings","Nói rõ ràng trong cuộc họp","talk",[["","Today I want to share some tips for speaking clearly in meetings.","Hôm nay tôi muốn chia sẻ vài mẹo để nói rõ ràng trong cuộc họp."],["","First, be brief. People stop listening after a minute.","Thứ nhất, hãy ngắn gọn. Mọi người ngừng nghe sau một phút."],["","Second, give specific examples, not just general ideas.","Thứ hai, đưa ví dụ cụ thể, đừng chỉ nêu ý tưởng chung chung."],["","Say 'sales rose twelve percent.' Be precise with numbers.","Hãy nói 'doanh số tăng mười hai phần trăm.' Hãy chính xác với các con số."],["","Third, use facts and evidence. Opinions are fine, but evidence is stronger.","Thứ ba, dùng sự thật và bằng chứng. Ý kiến thì được, nhưng bằng chứng mạnh hơn."],["","Fourth, stay relevant. If a point doesn't help the topic, leave it out.","Thứ tư, đi đúng chủ đề. Nếu một điểm không liên quan đến chủ đề, hãy bỏ nó đi."],["","Some details are essential, and some are minor.","Một số chi tiết là thiết yếu, một số khác thì thứ yếu."],["","Focus on the major ones. The delivery date is essential. The color of the box is minor.","Hãy tập trung vào những điểm chính. Ngày giao hàng là thiết yếu. Màu của chiếc hộp là thứ yếu."],["","When I started doing this, my meetings became shorter and better.","Từ khi tôi làm vậy, các cuộc họp của tôi ngắn hơn và hiệu quả hơn."],["","Try it this week. You'll see the difference.","Hãy thử trong tuần này. Bạn sẽ thấy sự khác biệt."]]],"13":["Project Status Check","Kiểm tra tình hình dự án","dialogue",[["Priya","Tom, thanks for joining. Let's review the current project status.","Tom, cảm ơn đã tham gia. Hãy xem lại tình hình dự án hiện tại."],["Tom","Sure. Compared to the previous quarter, we're ahead.","Vâng. So với quý trước, chúng ta đang đi trước kế hoạch."],["Priya","Good. Is the upcoming deadline still realistic?","Tốt. Hạn chót sắp tới còn khả thi không?"],["Tom","Yes, but one thing is critical. We need regular updates from the design team.","Có, nhưng có một điều then chốt. Chúng ta cần cập nhật thường xuyên từ nhóm thiết kế."],["Priya","Right. Can we set a weekly check-in?","Đúng. Mình đặt một buổi trao đổi hằng tuần được không?"],["Tom","Weekly works. We also have the monthly report due on the fifth.","Hằng tuần thì được. Ngoài ra còn có báo cáo hằng tháng đến hạn vào ngày mùng năm."],["Priya","And the annual review in December?","Còn đợt đánh giá hằng năm vào tháng Mười Hai?"],["Tom","That's still far away. But there's a potential problem with the budget.","Còn xa. Nhưng có một vấn đề tiềm ẩn về ngân sách."],["Priya","Tell me more.","Nói rõ hơn đi."],["Tom","Our daily costs are higher than planned. If it continues, we'll go over.","Chi phí hằng ngày cao hơn kế hoạch. Nếu cứ thế, chúng ta sẽ vượt ngân sách."],["Priya","Okay. Let's look at the numbers tomorrow.","Được. Mai mình xem các con số."],["Tom","Sounds good. I'll prepare a short summary tonight.","Hợp lý. Tối nay tôi sẽ chuẩn bị một bản tóm tắt ngắn."]]],"14":["Our Office Move","Việc chuyển văn phòng","talk",[["","Let me tell you about our office move.","Để tôi kể về việc chuyển văn phòng của chúng tôi."],["","Our initial plan was a temporary space for three months.","Kế hoạch ban đầu là một không gian tạm thời trong ba tháng."],["","Basically, we'd rent a small floor while the main building was repaired.","Về cơ bản, chúng tôi thuê một tầng nhỏ trong lúc tòa nhà chính được sửa."],["","Generally, that works fine. But the repairs took longer.","Nói chung, như vậy ổn. Nhưng việc sửa chữa kéo dài hơn."],["","Now we need additional time, so the temporary space is becoming permanent.","Giờ chúng tôi cần thêm thời gian, nên chỗ tạm đang trở thành chỗ lâu dài."],["","The manager wants an immediate decision.","Quản lý muốn có quyết định ngay lập tức."],["","I think we need further information first.","Tôi nghĩ trước hết cần thêm thông tin."],["","We should see the final cost before we agree.","Chúng ta nên xem chi phí cuối cùng trước khi đồng ý."],["","Overall, I'm happy with the new place. It's bright and quiet.","Nhìn chung, tôi hài lòng với chỗ mới. Nó sáng và yên tĩnh."],["","But I'd like a clear answer soon.","Nhưng tôi muốn có câu trả lời rõ ràng sớm."],["","My team feels the same. We've been patient for months.","Nhóm tôi cũng thấy vậy. Chúng tôi đã kiên nhẫn suốt mấy tháng."],["","So tomorrow I'll ask for a short meeting with the manager.","Vì vậy ngày mai tôi sẽ xin một buổi họp ngắn với quản lý."]]],"15":["Training the Support Team","Đào tạo nhóm hỗ trợ","dialogue",[["Raj","Anna, how many people are currently on the support team?","Anna, hiện nay nhóm hỗ trợ có bao nhiêu người?"],["Anna","Approximately twenty. Previously we had fifteen.","Khoảng hai mươi người. Trước đây chúng ta có mười lăm."],["Raj","Are they trained properly?","Họ được đào tạo đúng cách chưa?"],["Anna","Yes. We train them regularly, every month.","Rồi. Chúng tôi đào tạo họ thường xuyên, mỗi tháng."],["Raj","Good. Can I speak to the team directly?","Tốt. Tôi nói chuyện trực tiếp với nhóm được không?"],["Anna","Of course. I'll call them in immediately.","Dĩ nhiên. Tôi sẽ gọi họ vào ngay."],["Raj","Thanks. I'll explain the new plan briefly.","Cảm ơn. Tôi sẽ giải thích ngắn gọn kế hoạch mới."],["Anna","Please explain it clearly. Some people are new.","Hãy giải thích thật rõ ràng nhé. Có vài người mới."],["Raj","Of course. Eventually, I want everyone to handle calls alone.","Dĩ nhiên. Cuối cùng thì tôi muốn mọi người tự xử lý cuộc gọi."],["Anna","That will take time, but we'll get there.","Việc đó sẽ mất thời gian, nhưng chúng ta sẽ làm được."],["Raj","Do you need anything from me before the session?","Bạn có cần gì từ tôi trước buổi đào tạo không?"],["Anna","Just a list of common customer questions.","Chỉ cần danh sách các câu hỏi thường gặp của khách hàng."],["Raj","No problem. I'll send it this afternoon.","Không vấn đề. Chiều nay tôi sẽ gửi."],["Anna","Perfect. Let's start at ten tomorrow morning.","Tuyệt. Mình bắt đầu lúc mười giờ sáng mai nhé."],["Raj","Sounds good. I'll book the meeting room.","Được. Tôi sẽ đặt phòng họp."]]],"16":["My First Online Meeting","Cuộc họp trực tuyến đầu tiên","talk",[["","Last week I joined an online meeting with a team in Scotland.","Tuần trước tôi tham gia một cuộc họp trực tuyến với một nhóm ở Scotland."],["","I got the invitation by email, with a link.","Tôi nhận lời mời qua email, kèm một đường dẫn."],["","My connection was weak, so the signal kept dropping.","Kết nối của tôi yếu, nên tín hiệu cứ bị mất."],["","Everyone had a different accent.","Mỗi người có một giọng khác nhau."],["","I practiced my pronunciation by repeating new words quietly.","Tôi luyện cách phát âm bằng cách lặp lại các từ mới khe khẽ."],["","One man's volume was too low, so I asked him to speak louder.","Âm lượng của một người đàn ông quá nhỏ, nên tôi nhờ anh ấy nói to hơn."],["","Another person forgot to mute, and we heard a dog barking.","Một người khác quên tắt tiếng, và chúng tôi nghe tiếng chó sủa."],["","Then she wanted to talk and forgot to unmute. It was funny.","Rồi cô ấy muốn nói nhưng quên bật tiếng. Thật buồn cười."],["","After the meeting, I sent my notes to each person separately.","Sau cuộc họp, tôi gửi ghi chú riêng cho từng người."],["","Online meetings are tricky, but I'm improving.","Họp trực tuyến khá khó, nhưng tôi đang tiến bộ."],["","Next time, I'll test everything ten minutes early.","Lần sau, tôi sẽ kiểm tra mọi thứ sớm mười phút."],["","Small habits make a big difference.","Những thói quen nhỏ tạo nên khác biệt lớn."]]],"17":["Rescheduling a Call","Dời lịch cuộc gọi","dialogue",[["Sarah","Hi Mark, did you get my calendar invite for Thursday?","Chào Mark, bạn nhận được lời mời trên lịch của tôi cho thứ Năm chưa?"],["Mark","I did, but the time zone is confusing. Is it nine London time?","Rồi, nhưng múi giờ làm tôi rối. Là chín giờ giờ London à?"],["Sarah","Yes, nine in London. That's three in the afternoon for you.","Đúng, chín giờ ở London. Với bạn là ba giờ chiều."],["Mark","I might be late, though. Can we reschedule to four?","Nhưng tôi có thể sẽ đến trễ. Mình dời sang bốn giờ được không?"],["Sarah","Hold on, let me check. Yes, four works.","Chờ một chút, để tôi xem. Được, bốn giờ ổn."],["Mark","Great. Last time I had to drop out because my internet failed.","Tuyệt. Lần trước tôi phải thoát giữa chừng vì mạng hỏng."],["Sarah","No problem. If that happens, just call back on my extension.","Không sao. Nếu vậy, cứ gọi lại vào số máy nhánh của tôi."],["Mark","What if you don't pick up?","Nếu bạn không bắt máy thì sao?"],["Sarah","Then leave a voicemail. I'll check it right away.","Thì để lại tin nhắn thoại. Tôi sẽ nghe ngay."],["Mark","Okay. I'll hang up now and update my calendar.","Được. Giờ tôi cúp máy và cập nhật lịch."],["Sarah","Thanks, Sarah. Talk to you Thursday.","Cảm ơn Sarah. Hẹn gặp bạn vào thứ Năm."],["Mark","See you then. Bye for now.","Hẹn gặp lúc đó. Tạm biệt nhé."]]],"18":["Learning to Speak Up","Học cách mạnh dạn lên tiếng","talk",[["","When I started working with international clients, I was nervous.","Khi bắt đầu làm việc với khách hàng quốc tế, tôi rất lo."],["","English isn't my native language. I wasn't fluent, and I often missed words.","Tiếng Anh không phải tiếng mẹ đẻ của tôi. Tôi chưa trôi chảy và hay nghe sót từ."],["","At first I stayed quiet. Then I learned to speak up.","Lúc đầu tôi im lặng. Sau đó tôi học cách nói to lên."],["","If I don't understand, I say, 'Could you say that again?'","Nếu không hiểu, tôi nói: 'Bạn nói lại được không?'"],["","Nobody minds.","Không ai phiền cả."],["","Sometimes I use an app to translate new vocabulary.","Đôi khi tôi dùng một ứng dụng để dịch từ vựng mới."],["","In big meetings, we hire an interpreter. But I prefer to manage myself.","Trong các cuộc họp lớn, chúng tôi thuê thông dịch viên. Nhưng tôi thích tự xoay xở."],["","I don't worry about perfect grammar anymore.","Tôi không còn lo về ngữ pháp hoàn hảo nữa."],["","A short, simple sentence is better than a long mistake.","Một câu ngắn, đơn giản tốt hơn một câu dài mà sai."],["","Language is a tool for connection, not a test.","Ngôn ngữ là công cụ để kết nối, không phải bài kiểm tra."],["","Last week, a client even complimented my English.","Tuần trước, một khách hàng còn khen tiếng Anh của tôi."],["","That made me proud.","Điều đó khiến tôi tự hào."]]],"19":["Advice Before Visiting Japan","Lời khuyên trước khi đến Nhật","dialogue",[["Emma","Kenji, I'm visiting Tokyo next week. Any advice about the culture?","Kenji, tuần sau tôi đến Tokyo. Có lời khuyên nào về văn hóa không?"],["Kenji","Sure. The greeting is important. A small bow shows respect.","Có chứ. Lời chào rất quan trọng. Một cái cúi nhẹ thể hiện sự tôn trọng."],["Emma","Do people still do a handshake?","Mọi người vẫn bắt tay chứ?"],["Kenji","With foreigners, yes. A light handshake is fine.","Với người nước ngoài thì có. Bắt tay nhẹ là được."],["Emma","Is there a custom for meetings?","Có phong tục nào cho các buổi họp không?"],["Kenji","Yes. There's a tradition of arriving ten minutes early.","Có. Có một truyền thống là đến sớm mười phút."],["Emma","I heard a phrase, 'yoroshiku onegaishimasu.' What's the meaning?","Tôi nghe một cụm là 'yoroshiku onegaishimasu.' Nó nghĩa là gì?"],["Kenji","Roughly, 'I look forward to working with you.' It's a polite expression.","Đại khái là 'Rất mong được làm việc cùng bạn.' Đó là một cách nói lịch sự."],["Emma","What about my tone?","Còn giọng điệu của tôi thì sao?"],["Kenji","Keep your tone calm and polite. That's enough.","Hãy giữ giọng điệu bình tĩnh và lịch sự. Thế là đủ."],["Emma","Thanks, that's really helpful.","Cảm ơn, thật sự hữu ích."],["Kenji","One more thing. Please don't rush the first meeting.","Còn một điều nữa. Đừng vội vàng trong buổi họp đầu tiên."],["Emma","Understood. I'll take my time and listen carefully.","Hiểu rồi. Tôi sẽ thong thả và lắng nghe cẩn thận."],["Kenji","They'll appreciate that. Have a great trip.","Họ sẽ trân trọng điều đó. Chúc bạn chuyến đi tốt đẹp."]]],"20":["My First Networking Event","Sự kiện kết nối đầu tiên","talk",[["","Last month I went to a networking event. I was nervous.","Tháng trước tôi đến một sự kiện kết nối. Tôi rất hồi hộp."],["","But I handed my business card to everyone I met.","Nhưng tôi đưa danh thiếp cho tất cả những người tôi gặp."],["","Small talk is the best way to start. I asked about their weekend or travel.","Chuyện phiếm là cách tốt nhất để bắt đầu. Tôi hỏi về cuối tuần hay chuyến đi của họ."],["","A first impression matters.","Ấn tượng đầu tiên rất quan trọng."],["","Good relationships come from trust, and your reputation follows you.","Mối quan hệ tốt đến từ sự tin tưởng, và danh tiếng luôn theo bạn."],["","One man liked my ideas. After a short discussion, we reached an agreement.","Một người đàn ông thích ý tưởng của tôi. Sau một cuộc thảo luận ngắn, chúng tôi đạt được thỏa thuận."],["","It was for a small trial project.","Đó là một dự án thử nghiệm nhỏ."],["","His response by email was fast. I was surprised by his positive reaction.","Phản hồi qua email của anh ấy rất nhanh. Tôi ngạc nhiên trước phản ứng tích cực của anh ấy."],["","Now I go to these events every month.","Giờ tôi đi các sự kiện như vậy mỗi tháng."],["","My advice is simple. Be kind, be curious, and follow up.","Lời khuyên của tôi rất đơn giản. Hãy tử tế, tò mò và nhớ liên lạc lại."],["","Send a short message the next day.","Hãy gửi một tin nhắn ngắn vào hôm sau."]]],"21":["A Supplier Update","Cập nhật về nhà cung cấp","dialogue",[["Sarah","Thanks for joining, Mark. Did you see the announcement this morning?","Cảm ơn đã tham gia, Mark. Anh có thấy thông báo sáng nay không?"],["Mark","Yes. The new supplier is ready to work with us.","Có. Nhà cung cấp mới sẵn sàng làm việc với chúng ta."],["Sarah","Good. I need your full attention on the quote they sent.","Tốt. Tôi cần anh tập trung vào bản báo giá họ gửi."],["Mark","Sure. It looks fair, but our budget is tight this quarter.","Được. Nhìn cũng hợp lý, nhưng ngân sách quý này khá eo hẹp."],["Sarah","I had a long conversation with them yesterday.","Hôm qua tôi đã có cuộc trò chuyện dài với họ."],["Mark","They'll give us a discount if we sign the contract this week.","Họ sẽ giảm giá cho chúng ta nếu ký hợp đồng trong tuần này."],["Sarah","How big is the discount?","Giảm giá bao nhiêu vậy?"],["Mark","Ten percent on the first order.","Mười phần trăm cho đơn hàng đầu tiên."],["Sarah","Nice. What about payment?","Hay đấy. Còn thanh toán thì sao?"],["Mark","We pay thirty days after we receive the invoice.","Chúng ta trả sau ba mươi ngày kể từ khi nhận hóa đơn."],["Sarah","And delivery?","Còn giao hàng?"],["Mark","They promise delivery within two weeks.","Họ hứa giao hàng trong vòng hai tuần."],["Sarah","Okay. Let's read the contract again before we sign.","Được. Hãy đọc lại hợp đồng trước khi ký."],["Mark","Agreed. I'll send it to you now.","Đồng ý. Tôi gửi cho anh ngay đây."]]],"22":["Winning a New Customer","Giành được một khách hàng mới","talk",[["","Last month, I met a new customer at a trade show.","Tháng trước, tôi gặp một khách hàng mới tại hội chợ thương mại."],["","She wanted a sample before placing any order.","Cô ấy muốn có hàng mẫu trước khi đặt bất kỳ đơn hàng nào."],["","So I sent one the next day.","Vì vậy tôi đã gửi một mẫu vào hôm sau."],["","She liked it, but she wanted to negotiate.","Cô ấy thích nó, nhưng muốn thương lượng."],["","First, we talked about the price.","Đầu tiên, chúng tôi nói về giá."],["","A competitor was offering a lower number.","Một đối thủ cạnh tranh đang chào mức giá thấp hơn."],["","I explained that our quality is better.","Tôi giải thích rằng chất lượng của chúng tôi tốt hơn."],["","Then we discussed the terms of the deal.","Sau đó chúng tôi bàn về các điều khoản của thỏa thuận."],["","We agreed on a longer payment period.","Chúng tôi đồng ý kéo dài thời hạn thanh toán."],["","I also promised we could supply her shop every month.","Tôi cũng hứa có thể cung cấp cho cửa hàng của cô ấy hàng tháng."],["","She said the market here is changing fast.","Cô ấy nói thị trường ở đây đang thay đổi nhanh."],["","I think this deal will help our sales a lot.","Tôi nghĩ thỏa thuận này sẽ giúp doanh số của chúng tôi tăng nhiều."],["","It was a long day, but a good one.","Đó là một ngày dài, nhưng là một ngày tốt."]]],"23":["Who Buys From Whom","Ai mua từ ai","dialogue",[["Priya","James, I'm new here. Can you explain our sales chain?","James, tôi mới đến. Anh giải thích chuỗi bán hàng của chúng ta được không?"],["James","Sure, Priya. We're the seller, and the factory is our supplier.","Được, Priya. Chúng ta là người bán, còn nhà máy là nhà cung cấp của chúng ta."],["Priya","So who is our buyer?","Vậy người mua của chúng ta là ai?"],["James","Mostly a distributor. He sells our goods to many shops.","Chủ yếu là một nhà phân phối. Ông ấy bán hàng hóa của chúng ta cho nhiều cửa hàng."],["Priya","And those shops are retailers?","Và những cửa hàng đó là nhà bán lẻ?"],["James","Right. They do retail, selling one item at a time.","Đúng. Họ bán lẻ, từng món một."],["Priya","Do we also do wholesale?","Chúng ta cũng bán sỉ chứ?"],["James","Yes, for big orders we offer a wholesale price.","Có, với đơn lớn chúng ta có giá bán sỉ."],["Priya","What does a good salesperson do here?","Một nhân viên bán hàng giỏi ở đây làm gì?"],["James","She listens first. Then she checks our stock.","Cô ấy lắng nghe trước. Sau đó kiểm tra hàng tồn của chúng ta."],["Priya","Why check the stock?","Tại sao phải kiểm tra hàng tồn?"],["James","Because we should never promise goods we don't have.","Vì chúng ta không nên hứa những hàng hóa mình không có."],["Priya","That makes sense. Thanks, James.","Có lý. Cảm ơn anh, James."],["Priya","Is it hard to learn all of this?","Học hết những điều này có khó không?"],["James","Not really. You'll pick it up in a couple of weeks.","Không hẳn. Chị sẽ nắm được trong vài tuần."]]],"24":["Our Product Launch","Buổi ra mắt sản phẩm của chúng tôi","talk",[["","This week, I'm preparing our new product launch.","Tuần này, tôi đang chuẩn bị buổi ra mắt sản phẩm mới."],["","First, I checked our inventory.","Trước tiên, tôi kiểm tra hàng tồn kho."],["","We have a shortage of small boxes.","Chúng ta đang thiếu hụt hộp nhỏ."],["","Demand is higher than we expected.","Nhu cầu cao hơn chúng tôi dự đoán."],["","Our brand is becoming popular with young people.","Thương hiệu của chúng tôi đang trở nên phổ biến với giới trẻ."],["","So we're changing the logo to look more modern.","Vì vậy chúng tôi đổi logo để trông hiện đại hơn."],["","The new packaging is simple and bright.","Bao bì mới đơn giản và tươi sáng."],["","Each label shows the ingredients clearly.","Mỗi nhãn ghi rõ thành phần."],["","We'll send every customer a free package with small gifts.","Chúng tôi sẽ gửi mỗi khách hàng một gói quà nhỏ miễn phí."],["","I'm also updating our catalog with new photos.","Tôi cũng đang cập nhật danh mục sản phẩm với ảnh mới."],["","Next, I'll print a short brochure for the shop.","Tiếp theo, tôi sẽ in một tờ rơi ngắn cho cửa hàng."],["","I hope everything is ready by Friday.","Tôi hy vọng mọi thứ sẽ sẵn sàng vào thứ Sáu."],["","Our designer worked very hard on this project.","Nhà thiết kế của chúng tôi đã làm việc rất chăm chỉ cho dự án này."],["","I'm excited to see how people react.","Tôi rất háo hức xem mọi người phản ứng ra sao."],["","Wish us luck!","Chúc chúng tôi may mắn nhé!"]]],"25":["Choosing a Product","Chọn sản phẩm","dialogue",[["Sarah","Hi Mark. I'm looking for a new office chair for my team.","Chào Mark. Tôi đang tìm ghế văn phòng mới cho nhóm."],["Mark","Of course. Which model do you have in mind?","Tất nhiên rồi. Chị đang nghĩ đến mẫu nào?"],["Sarah","I haven't decided. Can I see the specification first?","Tôi chưa quyết định. Cho tôi xem thông số kỹ thuật trước được không?"],["Mark","Sure. Here's the full range, and there's a wide variety of colors.","Được. Đây là toàn bộ dải sản phẩm, và có rất nhiều màu."],["Sarah","Can you customize the logo on the back?","Anh có thể tùy chỉnh logo ở lưng ghế không?"],["Mark","Yes. We also make custom-made chairs for special sizes.","Có. Chúng tôi cũng làm ghế theo yêu cầu cho các kích cỡ đặc biệt."],["Sarah","What's the minimum order?","Đơn hàng tối thiểu là bao nhiêu?"],["Mark","Fifty units. The maximum is five hundred.","Năm mươi chiếc. Tối đa là năm trăm."],["Sarah","I need about eighty. Is there a bulk price?","Tôi cần khoảng tám mươi. Có giá cho số lượng lớn không?"],["Mark","Yes, above sixty units the price drops.","Có, trên sáu mươi chiếc thì giá giảm."],["Sarah","That sounds good.","Nghe ổn đấy."],["Mark","I'll send you a written offer today.","Hôm nay tôi sẽ gửi chị một bản chào giá bằng văn bản."]]],"26":["Following a Shipment","Theo dõi một chuyến hàng","talk",[["","Let me explain how we handle a big shipment.","Để tôi giải thích cách chúng tôi xử lý một chuyến hàng lớn."],["","First, we finish a batch at the factory.","Đầu tiên, chúng tôi hoàn thành một lô hàng tại nhà máy."],["","Then workers load the cargo into a container.","Sau đó công nhân chất hàng vận chuyển vào container."],["","A truck takes it to the port.","Một chiếc xe tải chở nó đến cảng."],["","Shipping usually takes about three weeks.","Việc vận chuyển thường mất khoảng ba tuần."],["","The freight cost depends on the weight and the season.","Cước vận tải phụ thuộc vào trọng lượng và mùa."],["","Before we export anything, we need the right papers.","Trước khi xuất khẩu bất cứ thứ gì, chúng tôi cần giấy tờ đúng."],["","Customs officers check every document carefully.","Nhân viên hải quan kiểm tra kỹ từng giấy tờ."],["","If something is missing, the container waits.","Nếu thiếu gì đó, container sẽ phải chờ."],["","Our buyer must also handle the import process in his country.","Người mua của chúng tôi cũng phải lo thủ tục nhập khẩu ở nước họ."],["","That's why we always plan early.","Đó là lý do chúng tôi luôn lên kế hoạch sớm."],["","One small mistake can cost us a lot of time.","Một lỗi nhỏ có thể khiến chúng tôi mất rất nhiều thời gian."],["","Good planning keeps our clients happy.","Lên kế hoạch tốt giúp khách hàng của chúng tôi hài lòng."],["","I check the schedule every single morning.","Tôi kiểm tra lịch trình mỗi sáng."],["","Then I call our partners to confirm.","Sau đó tôi gọi cho các đối tác để xác nhận."]]],"27":["A Problem With an Order","Vấn đề với một đơn hàng","dialogue",[["Priya","Hello, James. I'd like to make a complaint.","Xin chào, James. Tôi muốn khiếu nại."],["James","I'm sorry to hear that, Priya. What's the problem?","Tôi rất tiếc khi nghe vậy, Priya. Vấn đề là gì?"],["Priya","The machine arrived damaged, and there's also a defect in the screen.","Chiếc máy đến nơi bị hỏng, và màn hình cũng có lỗi sản phẩm."],["James","Do you still have the warranty card?","Chị còn giữ thẻ bảo hành không?"],["Priya","Yes. It says we have a one-year guarantee.","Còn. Trong đó ghi chúng tôi được đảm bảo một năm."],["James","Good. Would you like a refund or an exchange?","Tốt. Chị muốn hoàn tiền hay đổi hàng?"],["Priya","I'd prefer an exchange. I need the machine this week.","Tôi muốn đổi hàng hơn. Tuần này tôi cần chiếc máy."],["James","No problem. We'll cover the tax on the new one.","Không vấn đề. Chúng tôi sẽ chịu thuế cho chiếc mới."],["Priya","Thank you. Was there an extra tariff on the first one?","Cảm ơn anh. Chiếc đầu có phải chịu thêm thuế quan không?"],["James","Yes, but we'll return that money.","Có, nhưng chúng tôi sẽ hoàn lại số tiền đó."],["Priya","Also, please check your import license is up to date.","Ngoài ra, xin chị kiểm tra giấy phép nhập khẩu còn hiệu lực."],["James","I will. Thanks for your help.","Tôi sẽ làm. Cảm ơn anh đã giúp."]]],"28":["Keeping Customers Happy","Giữ khách hàng hài lòng","talk",[["","Last week, a customer called about a faulty heater.","Tuần trước, một khách hàng gọi về chiếc máy sưởi bị lỗi."],["","She was upset, so I started with an apology.","Cô ấy rất bực, nên tôi bắt đầu bằng lời xin lỗi."],["","Then I promised a replacement within two days.","Sau đó tôi hứa gửi hàng thay thế trong vòng hai ngày."],["","I also offered a small compensation for her trouble.","Tôi cũng đề nghị một khoản bồi thường nhỏ cho sự bất tiện."],["","In the end, she was satisfied.","Cuối cùng, cô ấy đã hài lòng."],["","Customer satisfaction is the heart of our work.","Sự hài lòng của khách hàng là cốt lõi trong công việc của chúng tôi."],["","She's a regular customer, and she's very loyal to us.","Cô ấy là khách quen, và rất trung thành với chúng tôi."],["","She even sent a friend, a potential customer, to our shop.","Cô ấy còn giới thiệu một người bạn, một khách hàng tiềm năng, đến cửa hàng."],["","I think that friend is a good prospect.","Tôi nghĩ người bạn đó là một triển vọng tốt."],["","A small kind act can win a customer for life.","Một hành động tử tế nhỏ có thể giữ một khách hàng suốt đời."],["","That's what I tell my new colleagues every week.","Đó là điều tôi nói với các đồng nghiệp mới mỗi tuần."],["","I always follow up a week later.","Tôi luôn gọi lại sau một tuần."],["","It shows that we really care.","Điều đó cho thấy chúng tôi thật sự quan tâm."]]],"29":["Planning Our Strategy","Lên chiến lược của chúng ta","dialogue",[["Sarah","Mark, let's talk about our plan for next year.","Mark, hãy bàn về kế hoạch của chúng ta cho năm tới."],["Mark","Okay. Who's our target market?","Được. Thị trường mục tiêu của chúng ta là ai?"],["Sarah","Young families in big cities.","Các gia đình trẻ ở thành phố lớn."],["Mark","Our market share is small there, only five percent.","Thị phần của chúng ta ở đó nhỏ, chỉ năm phần trăm."],["Sarah","The competition is strong, isn't it?","Sự cạnh tranh rất mạnh, đúng không?"],["Mark","Yes, but our prices are competitive.","Đúng, nhưng giá của chúng ta có tính cạnh tranh."],["Sarah","What's our biggest advantage?","Lợi thế lớn nhất của chúng ta là gì?"],["Mark","Quality. That's our main strength.","Chất lượng. Đó là điểm mạnh chính của chúng ta."],["Sarah","And our weakness?","Còn điểm yếu?"],["Mark","Our delivery is slow. That's a real disadvantage.","Giao hàng của chúng ta chậm. Đó là một bất lợi thực sự."],["Sarah","We made a loss last quarter because of that.","Quý trước chúng ta bị lỗ vì chuyện đó."],["Mark","Let's fix it. Then we can make a profit again.","Hãy sửa nó. Sau đó chúng ta có thể có lợi nhuận trở lại."],["Sarah","Good idea. Let's meet on Monday to plan the details.","Ý hay. Hãy họp vào thứ Hai để lên kế hoạch chi tiết."],["Mark","Perfect. I'll prepare some numbers before then.","Tuyệt. Tôi sẽ chuẩn bị vài số liệu trước đó."]]],"30":["Understanding Our Costs","Hiểu về chi phí của chúng ta","talk",[["","Today, I'll explain how our small business makes money.","Hôm nay, tôi sẽ giải thích doanh nghiệp nhỏ của chúng tôi kiếm tiền thế nào."],["","Our revenue is all the money from sales.","Doanh thu của chúng tôi là toàn bộ tiền từ bán hàng."],["","But that isn't our income.","Nhưng đó không phải thu nhập của chúng tôi."],["","We must subtract every expense first.","Trước hết chúng tôi phải trừ mọi khoản chi."],["","What's left is our margin.","Phần còn lại là biên lợi nhuận."],["","We also set a fair rate for each service.","Chúng tôi cũng đặt mức giá hợp lý cho từng dịch vụ."],["","Customers pay a monthly fee for support.","Khách hàng trả phí hàng tháng cho dịch vụ hỗ trợ."],["","We don't charge for small questions.","Chúng tôi không tính phí cho những câu hỏi nhỏ."],["","But there's an extra charge for urgent visits.","Nhưng có phụ phí cho các lần đến gấp."],["","For big projects, we ask for a deposit first.","Với dự án lớn, chúng tôi yêu cầu đặt cọc trước."],["","Clients can pay the rest in three installments.","Khách hàng có thể trả phần còn lại thành ba lần trả góp."],["","This keeps things clear for everyone.","Điều này giúp mọi thứ rõ ràng với mọi người."],["","Many people forget these basic ideas.","Nhiều người quên những ý cơ bản này."],["","I hope this makes your own planning easier.","Tôi hy vọng điều này giúp việc lên kế hoạch của bạn dễ hơn."],["","Thanks for listening.","Cảm ơn đã lắng nghe."]]]};
let lis={veil:true,vi:false,pl:-1};
const LINTRO={meeting:['Today we are talking about meetings and teamwork. Listen carefully to the story.','Hôm nay chúng ta nói về họp hành và làm việc nhóm. Hãy nghe thật kỹ.'],business:['Today the topic is business and negotiation. Listen carefully to the story.','Hôm nay chủ đề là kinh doanh và đàm phán. Hãy nghe thật kỹ.'],office:['Today we are talking about the office and technology. Listen carefully to the story.','Hôm nay chúng ta nói về văn phòng và công nghệ. Hãy nghe thật kỹ.'],daily:['Today we are talking about everyday life. Listen carefully to the story.','Hôm nay chúng ta nói về đời sống hằng ngày. Hãy nghe thật kỹ.'],general:['Today we are practicing useful everyday words. Listen carefully to the story.','Hôm nay chúng ta luyện các từ thông dụng. Hãy nghe thật kỹ.']};
const MALEN=/^(Mark|Raj|James|Tom|Kenji|David|John|Paul|Peter|Ben|Alex|Ahmed|Carlos|Ravi|Amit|Jack|Ken|Tony|Sam|Mike|Michael)$/i;
const gOf=sp=>sp?(MALEN.test(sp)?'m':'f'):null;
const LOUTRO=['That is the end. Now listen once more, and try to catch every word.','Hết rồi. Bây giờ hãy nghe thêm một lần nữa và cố bắt từng từ.'];
function lisMake(ids,lesson){
  const u=[...new Set(ids)].map(byId).filter(Boolean).slice(0,10);if(!u.length)return null;
  let ph=lesson?phaseOf(lesson):null;
  if(!ph){const c={};u.forEach(w=>c[w.topic]=(c[w.topic]||0)+1);ph=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]}
  const pn=(PHASES.find(p=>p[0]===ph)||[0,'Từ vựng'])[1];
  return{ids:u.map(w=>w.id),ph,pn,lesson:lesson||0}}
function lisSents(L){
  const sc=L.lesson&&LSCR[L.lesson];
  if(sc)return sc[3].map(([sp,en,vi])=>({sp,en,vi,ws:lessonWords(L.lesson)}));
  const it=LINTRO[L.ph]||LINTRO.general,ws=L.ids.map(byId).filter(Boolean);
  return [{en:it[0],vi:it[1]}].concat(ws.map(w=>({en:w.ctx,vi:w.ctxvi,w}))).concat([{en:LOUTRO[0],vi:LOUTRO[1]}])}
function lisLine(s){
  if(s.ws){const hs=[];s.ws.forEach(w=>{const f=findIn(s.en,w.en);if(f)hs.push({i:f.i,n:f.form.length})});
    hs.sort((a,b)=>a.i-b.i);let o='',p=0;hs.forEach(x=>{if(x.i<p)return;o+=esc(s.en.slice(p,x.i))+'<b>'+esc(s.en.slice(x.i,x.i+x.n))+'</b>';p=x.i+x.n});
    return (s.sp?`<em class="sp">${gOf(s.sp)==='m'?'👨':'👩'} ${esc(s.sp)}:</em> `:'')+o+esc(s.en.slice(p))}
  if(!s.w)return esc(s.en);const f=findIn(s.en,s.w.en);if(!f)return esc(s.en);
  return esc(s.en.slice(0,f.i))+'<b>'+esc(f.form)+'</b>'+esc(s.en.slice(f.i+f.form.length))}
function lisPanel(L){
  if(!L)return '';const ss=lisSents(L),sc=L.lesson&&LSCR[L.lesson];
  return `<div class="panel lis stack"><span class="tag">🎧 Luyện nghe</span><h2>${sc?esc(sc[0]):'Bài nghe: '+esc(L.pn)}</h2>
    <p class="muted">${sc?(sc[2]==='dialogue'?'Hội thoại':'Bài nói')+' · '+esc(sc[1])+' · ngày '+L.lesson+'. Có đủ 10 từ bạn vừa học. ':'Đoạn này gồm các câu của '+L.ids.length+' từ bạn vừa học. '}Nghe trước, đoán nghĩa, rồi mới mở văn bản để kiểm tra.</p>

async function lisPlay(r){

/* ---------- Tab: Nghe cảnh ---------- */
function sceneSegs(sc){
  const used={};
  return sc.s.map(([en])=>{const hits=[];
    sc.t.forEach(t=>{if(used[t])return;const f=findIn(en,t);if(f){hits.push({t,i:f.i,form:f.form});used[t]=1}});
    hits.sort((a,b)=>a.i-b.i);const out=[];let p=0;
    hits.forEach(h=>{out.push({txt:en.slice(p,h.i)});out.push({blank:h});p=h.i+h.form.length});
    out.push({txt:en.slice(p)});return out})}
function openScene(id){
  const sc=SCENES.find(x=>x.id===id);let sh;
  do{sh=shuffle(sc.s.map((_,i)=>i))}while(sh.every((v,i)=>v===i));
  scn={id,step:1,ans:{},hint:false,c1:false,shuf:sh,order:[],c2:false,rev:{}}}

      ${scn.c2?`<div class="callout"><b>${scn.order.filter((v,p)=>v===p).length}/${sc.s.length}</b> câu đúng thứ tự.</div>`:''}
      <div class="row"><button class="btn primary grow" data-act="check2"${done?'':' disabled'}>Kiểm tra</button><button class="btn grow" data-act="reset2">Làm lại</button></div>`}
  if(scn.step===3){

      <div class="olist">${sc.s.map(([en,vi],i)=>`<div class="orow"><div style="flex:1;min-width:0"><div>${esc(vi)}</div><div class="${scn.rev[i]?'':'veil'}" data-act="rev" data-i="${i}" style="margin-top:4px;color:var(--accent)">${esc(en)}</div></div>

  return `<div class="stack"><div class="row between"><h2>${esc(sc.title)}</h2></div>${tabs}<div class="panel stack">${body}</div></div>`}

function confetti(){

const TABS=[['plan','Lộ trình','🗺️'],['learn','Luyện ngược','🎯'],['scene','Âm thanh','🔊'],['diag','Đo hai chiều','📊'],['bank','Kho từ','📚']];

/* ---------- sự kiện ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'tab':tab=d.v;stopAudio();render();break;
    case 'start':startSession();render();break;
    case 'lesson':startLesson(+d.v);render();break;
    case 'ph':{const cur=openPh===null?phaseOf(nextL()):openPh;openPh=cur===d.v?'none':d.v;pickL=null;render();break}
    case 'pick':pickL=pickL===+d.v?null:+d.v;render();break;
    case 'end':if(rec&&recOn){try{rec.abort()}catch(e){}}session=null;stopAudio();render();break;
    case 'inp':S.set.inp=d.v;save();render();break;
    case 'mic':micToggle();break;
    case 'reveal':{if(rec&&recOn){try{rec.stop()}catch(e){}}const t=$('#typed');if(t)session.typed=t.value;session.phase='back';render();
      if(S.set.auto){const w=byId(session.queue[session.idx]);say(w.en).then(()=>say(w.ctx))}break}
    case 'rate':stopAudio();rateCard(d.v);render();break;
    case 'sample':say("Hi, this is how I sound. Could you send me the quote by Friday, please?");break;
    case 'sayw':say(byId(d.id).en);break;
    case 'sayc':say(byId(d.id).ctx,d.slow?.7:undefined);break;
    case 'scene':openScene(d.id);render();break;
    case 'scenes':scn=null;stopAudio();render();break;
    case 'step':scn.step=+d.v;stopAudio();render();break;
    case 'playall':{const sc=SCENES.find(x=>x.id===scn.id);playSeq(sc.s.map(x=>x[0]),+d.r);break}
    case 'stop':stopAudio();lisMark(-1);break;
    case 'lplay':stopAudio();lisPlay(+d.r);break;
    case 'lveil':lis.veil=!lis.veil;stopAudio();render();break;
    case 'lvi':lis.vi=!lis.vi;render();break;
    case 'lsent':{const s=lisSents(S.listen)[+d.i];stopAudio();lisMark(+d.i);if(s){gOver=gOf(s.sp);say(s.en,.9,pickLang()).then(()=>{gOver=null})}break}
    case 'scs':{const sc=SCENES.find(x=>x.id===scn.id);say(sc.s[+d.i][0],d.slow?.7:undefined);break}
    case 'check1':scn.c1=true;render();break;
    case 'reset1':scn.ans={};scn.c1=false;render();break;
    case 'pick':{const i=+d.i,p=scn.order.indexOf(i);if(scn.c2)break;if(p>=0)scn.order.splice(p,1);else scn.order.push(i);render();break}
    case 'check2':scn.c2=true;render();break;
    case 'reset2':scn.order=[];scn.c2=false;render();break;
    case 'rev':scn.rev[+d.i]=!scn.rev[+d.i];render();break;
    case 'dgstart':dgStart();render();break;
    case 'dg1':dg.rec.push(d.v==='1');dg.i++;if(dg.i>=dg.ids.length){dg.phase='r2';dg.i=0}render();break;
    case 'dgrev':dg.rev=true;render();break;
    case 'dg2':dg.call.push(d.v==='1');dg.rev=false;dg.i++;
      if(dg.i>=dg.ids.length){dg.phase='res';
        S.diag.push({rec:dg.rec.filter(Boolean).length,call:dg.call.filter(Boolean).length,n:dg.ids.length,d:new Date().toLocaleDateString('vi-VN')});S.diag=S.diag.slice(-20);markDay();save()}
      render();break;
    case 'more':bankLim+=100;$('#wl').innerHTML=wlist();break;
    case 'dgadd':{const now=Date.now();dg.ids.forEach(id=>{if(dg.rec[dg.ids.indexOf(id)]&&!dg.call[dg.ids2.indexOf(id)]){S.prog[id]={box:0,due:now,seen:true}}});save();toast('Đã đưa vào lịch ôn. Vào tab Luyện ngược để học.');dg=null;tab='learn';render();break}
    case 'dgend':dg=null;render();break;
    case 'delc':S.custom=S.custom.filter(w=>w.id!==d.id);delete S.prog[d.id];save();$('#wl').innerHTML=wlist();break;
    case 'bkcopy':{const txt=JSON.stringify(S);
      const fb=()=>{const t=$('#bk');t.value=txt;t.select();toast('Hãy nhấn Ctrl+C (hoặc giữ và chọn Sao chép) để lấy mã.')};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép mã sao lưu.'),fb);else fb();break}
    case 'bkimp':{try{const o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.prog)throw 0;
      S=Object.assign({prog:{},custom:[],days:[],diag:[],set:{},plan:{done:0,last:''}},o);if(!S.plan)S.plan={done:0,last:''};planFix();S.set=Object.assign({accent:'en-US',rate:.9,mode:'auto',topic:'all',batch:10,auto:true,voice:'',v2:1},S.set);save();toast('Đã nhập tiến độ.');render()}
      catch(err){toast('Mã sao lưu không hợp lệ. Hãy dán lại toàn bộ đoạn mã.')}break}
  }});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('gap')&&scn)scn.ans[t.dataset.t]=t.value;
  if(t.id==='q'){bankQ=t.value;bankLim=100;$('#wl').innerHTML=wlist()}});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='set-accent'){S.set.accent=t.value;save()}
  else if(id==='set-gender'){S.set.gender=t.value;S.set.voice='';save();render()}
  else if(id==='set-rate'){S.set.rate=+t.value;save()}
  else if(id==='set-voice'){S.set.voice=t.value;save()}
  else if(id==='set-mode'){S.set.mode=t.value;save()}
  else if(id==='set-topic'){S.set.topic=t.value;save();render()}
  else if(id==='set-batch'){S.set.batch=+t.value;save();render()}
  else if(id==='set-auto'){S.set.auto=t.checked;save()}
  else if(id==='hint1'){scn.hint=t.checked;render()}
  else if(id==='bank-topic'){bankTopic=t.value;bankLim=100;$('#wl').innerHTML=wlist()}});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addf')return;e.preventDefault();
  const en=$('#a-en').value.trim(),vi=$('#a-vi').value.trim();if(!en||!vi)return;
  S.custom.push({id:'c'+Date.now(),topic:'custom',en,ipa:'',vi,ctx:$('#a-ctx').value.trim()||en,ctxvi:$('#a-ctxvi').value.trim()||vi});
  save();bankTopic='custom';bankQ='';bankLim=100;render();toast('Đã thêm "'+en+'" vào kho.')});
document.addEventListener('keydown',e=>{
  const b=$('#reveal');
  if(e.key==='Enter'&&tab==='learn'&&session&&session.phase==='back'&&!/TEXTAREA|SELECT/.test(e.target.tagName||'')){e.preventDefault();stopAudio();rateCard('next');render();return}
  if(e.key==='Enter'&&b&&!b.disabled&&(e.target.id==='typed'||e.target===document.body)){e.preventDefault();b.click();return}
  if(tab==='learn'&&session&&session.phase==='back'&&!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))){
    const m={'1':'ok','2':'near','3':'wrong','4':'forgot','5':'fail'}[e.key];if(m){stopAudio();rateCard(m);render()}}});

render();
})();
</script>
</body></html>
